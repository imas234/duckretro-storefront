<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to DuckRetro</title>
</head>
<body style="margin: 0; padding: 0; background-color: #050505; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Courier New', Courier, monospace;">

    <div style="text-align: center;">
        <h1 style="
            color: #fff;
            font-size: 5rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin: 0;
            cursor: pointer;
            text-shadow: 
                3px 3px 0px #ff00ff, 
                6px 6px 0px #00ffff;
            filter: drop-shadow(0 0 10px rgba(255, 0, 255, 0.7));
            animation: flicker 1.5s infinite alternate;
        ">
            Welcome to<br>
            <span style="font-style: italic; color: #f0f;">DuckRetro</span>
        </h1>
        
        <p style="color: #00ffff; letter-spacing: 2px; margin-top: 20px; font-weight: bold; text-transform: uppercase;">
            Press Start to Begin
        </p>
    </div>

    <!-- Retro Glow Animation -->
    <style>
        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                opacity: 1;
            }
            20%, 22%, 24%, 55% {
                opacity: 0.8;
                text-shadow: none;
            }
        }
    </style>

</body>
</html>
